[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-observability"
version = "1.0.0"
description = "Central telemetry and monitoring backbone for the Enterprise Context Engineering platform."
authors = [{ name = "Devopstrio", email = "engineering@devopstrio.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.10",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
    "pre-commit>=3.7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/context_observability"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "RUF"]
ignore = ["B008"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B104"]
