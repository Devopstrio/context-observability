apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: context-observability
  template:
    metadata:
      labels:
        app: context-observability
    spec:
      containers:
      - name: api
        image: devopstrio/context-observability:latest
        ports:
        - containerPort: 8080
